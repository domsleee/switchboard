schema_version: "1.1"
name: benchmark-video-on-windows
description: A recording the user wants to watch on another computer is published, not described.
tags: [trigger]
context:
  scaffold_script: fixture.sh
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    The benchmark recording is in bench/. Publish the benchmark video so I can watch it on Windows.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?switchboard-artifact"'
  - name: publish-command
    type: tool_used
    tool: Bash
    input_match: 'zellij switchboard artifact [^"]*tab-switch-benchmark\.mp4'
  - name: no-ad-hoc-server
    type: tool_used
    tool: Bash
    input_match: 'http\.server|serve_artifact|npx serve'
    min: 0
    max: 0
