schema_version: "1.1"
name: screenshot-on-laptop
description: Viewing a local screenshot from another computer publishes it through Switchboard.
tags: [trigger]
context:
  scaffold_script: fixture.sh
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I just saved sidebar-bug.png in this folder, it's a screenshot of the broken sidebar.
    Show me that screenshot on my laptop.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?switchboard-artifact"'
  - name: publish-command
    type: tool_used
    tool: Bash
    input_match: 'zellij switchboard artifact [^"]*sidebar-bug\.png'
