schema_version: "1.1"
name: resize-screenshot
description: Editing an image without asking to view it elsewhere leaves the skill alone.
tags: [no-trigger]
context:
  scaffold_script: fixture.sh
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a Python script, thumb.py, that saves a half-size copy of sidebar-bug.png as thumb.png using Pillow. Don't run it.
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'switchboard-artifact'
    min: 0
    max: 0
    arm: both
  - name: no-publish
    type: tool_used
    tool: Bash
    input_match: 'zellij switchboard artifact'
    min: 0
    max: 0
  - name: script-written
    type: file_exists
    path: thumb.py
