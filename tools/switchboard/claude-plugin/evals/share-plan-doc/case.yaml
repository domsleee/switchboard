schema_version: "1.1"
name: share-plan-doc
description: Sharing a Markdown plan publishes it with the image it references, so the relative link still works.
tags: [trigger]
context:
  scaffold_script: fixture.sh
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Share the plan doc.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?switchboard-artifact"'
  - name: publishes-plan-with-image
    type: tool_used
    tool: Bash
    input_match: 'zellij switchboard artifact [^"]*PLAN\.md[^"]*images/flow\.png'
