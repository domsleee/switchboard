schema_version: "1.1"
name: unrelated-cli-flag
description: An ordinary coding task leaves the skill alone.
tags: [no-trigger]
context:
  scaffold_script: fixture.sh
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Add a --verbose flag to cli.py that prints each file name before it is counted.
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: 'switchboard-artifact'
    min: 0
    max: 0
    arm: both
  - name: no-publish
    type: tool_used
    tool: Bash
    input_match: 'zellij switchboard artifact'
    min: 0
    max: 0
  - name: flag-added
    type: regex
    pattern: '--verbose'
    target: { source: file, path: cli.py }
