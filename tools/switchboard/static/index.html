<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zellij Switchboard</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script defer src="/titles.js"></script><script defer src="/app.js"></script></head>
<body><header><strong>Zellij <span>Switchboard</span></strong><span id="notifications" role="status" aria-live="polite">0 notifications</span><nav id="filters" aria-label="Machine group"><button data-filter="all" class="selected">All</button><button data-filter="work">Work</button><button data-filter="home">Home</button></nav><button id="new-tab">+ New tab</button><button id="copy" title="Copy terminal selection to this browser’s clipboard">Copy</button><button id="ready" title="Mark selected tab as ready for review">☆ Mark ready</button><button id="native-tabs" aria-pressed="false" title="Show the original Zellij tab bar inside each terminal">Native tabs</button><button id="refresh">Refresh</button><button id="settings" aria-expanded="false">Machines</button></header>
<section id="machines" hidden></section><nav id="tabs" aria-label="Tabs across machines" title="Alt+Left/Right or H/L: switch tabs · Add Shift to reorder"></nav><main id="terminals"><p id="empty">Connecting to your machines…</p><section id="artifact-preview" hidden aria-label="Artifact preview"><header><button id="artifact-back">← Back to terminal</button><span id="artifact-url"></span><a id="artifact-external" target="_blank" rel="noopener noreferrer">Open in browser tab</a></header><iframe id="artifact-frame" title="Artifact preview" sandbox="allow-scripts allow-forms allow-same-origin allow-downloads allow-modals" referrerpolicy="no-referrer"></iframe></section></main><footer id="status" role="status">Loading sessions…</footer>
<dialog id="new-tab-dialog"><form id="new-tab-form"><h2>New tab</h2><label for="new-tab-target">Machine and session</label><select id="new-tab-target" required></select><p>Opens a shell on the selected machine.</p><div class="dialog-actions"><button type="button" id="cancel-new-tab">Cancel</button><button type="submit">Create tab</button></div></form></dialog>
</body></html>
