<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,const"><title>Switchboard Health mockup</title><link rel="stylesheet" href="../../tools/switchboard/static/style.css"><style>body{height:auto;min-height:100vh;background:#0b0d11;padding:48px 20px} .mock-wrap{width:min(640px,100%);margin:auto}.mock-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8590a3;margin-bottom:18px}#panel{position:static!important;display:block!important;width:100%!important;max-height:none!important;height:auto!important;border:1px solid #303744;border-radius:12px;padding:24px!important;background:#181b22}h1{font-size:22px;margin:0 0 24px}.mock-tabs{border-bottom:1px solid #303744;padding-bottom:12px;margin-bottom:22px;color:#8590a3;font-size:12px}.mock-tabs strong{color:#9dc2fa;margin-right:24px}.mock-caption{color:#8590a3;font-size:12px;line-height:1.7;margin-top:20px}#status-message{color:#e7b966;font-size:12px}@media(max-width:480px){body{padding:20px 10px}#panel{padding:16px!important}}</style><div class="mock-wrap"><div class="mock-label">Switchboard / interactive concept</div><div id="panel"><h1>Settings</h1><div class="mock-tabs"><strong>Health</strong>Appearance &nbsp; · &nbsp; Computers</div><section id="panel-health"><div class="settings-heading health-heading"><p id="health-summary" role="status">Checking computers…</p><div class="health-actions"><button id="refresh-updates">Refresh</button><button id="fix-all-health">Fix all</button></div></div><p class="health-help">Fixes missing plugins, hooks, stale skills and failed tasks. Up-to-date items are left alone.</p><div id="health-batch" role="status" aria-live="polite" hidden></div><section id="updates" class="settings-group" aria-label="Health"></section></section><p id="status-message" role="status"></p></div><p class="mock-caption">Mock data. Expand a computer for details, or try Fix all.<br>No commands are sent to your computers.</p></div><script>
const now=Date.now();
const computers=['Laptop 1','Laptop 2','Laptop 3','Laptop 4','Laptop 5'].map((name,i)=>({name,local:i===0,host:i?`demo-${i}`:undefined,error:null,switchboard:{commit:'40506c9',commitDate:'2026-11-07',automaticUpdates:true,updateNow:true},agents:[{agent:'codex',name:'Codex',state:'ready',detail:'Plugin installed',lastReport:now-120000,skills:{state:'ok',warnings:[]}}],groups:[{name:'dotfiles',every:'12h',enabled:true,paused:false,running:false,status:i===0?'changed':'ok',summary:i===0?'dotfiles: 1 new commits not pulled, local changes':'',lastStart:now-300000,lastEnd:now-290000,nextRun:now+43200000,tasks:[{name:'pull + install',status:'ok',finished:now-290000,durationMs:5200,changed:[],tail:[]}]}]}));
computers[1].agents[0].skills={state:'attention',warnings:['dotfiles-skills: cached skills differ from source'],refreshPlugins:['dotfiles-skills@dotfiles']};computers[1].agents[0].skillRepair={supported:true};
document.addEventListener('click',event=>{const a=event.target.closest('a');if(a?.getAttribute('href')?.startsWith('/api/tasks/log')){event.preventDefault();document.getElementById('status-message').textContent='Mock log: checked dotfiles and plugins. No changes required.'}});
window.fetch=async(url,options={})=>{if(url==='/api/tasks')return new Response(JSON.stringify({computers}),{headers:{'content-type':'application/json'}});const b=JSON.parse(options.body||'{}'),c=computers.find(c=>(c.host||'')===(b.host||''));if(url==='/api/tasks/action'&&c){const g=c.groups.find(g=>g.name===b.group);if(b.action==='run'){g.running=true;g.status='running';g.lastStart=Date.now();setTimeout(()=>{g.running=false;g.lastEnd=Date.now();g.status=c.local?'changed':'ok';g.summary=c.local?'dotfiles: 1 new commits not pulled, local changes':'';SwitchboardTasks.load()},1800+Math.random()*2500)}else if(b.action==='pause')g.paused=true;else if(b.action==='resume')g.paused=false;else if(b.action==='clear')g.notice=false}else if(url==='/api/tasks/setup'&&c){c.agents[0].skills={state:'ok',warnings:[]};c.agents[0].skillRepair={supported:true,finished:Date.now()}}return new Response('{}')};
</script><script src="../../tools/switchboard/static/tasks.js"></script></html>
