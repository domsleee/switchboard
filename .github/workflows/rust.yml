name: Rust

on:
  # PR checks run on the PR merged into main, so merges are not rerun. Main
  # runs nightly to refresh the caches PRs restore; 16:00 UTC is 3 am in Sydney.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Debug Clap parsing exceeds the default test-thread stack.
  RUST_MIN_STACK: 8388608
  # rust-cache restores dependencies only; sccache also skips this workspace's own
  # crates when a PR did not change them. A cache service error compiles locally.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  # A new push to a PR replaces its run. Main runs finish so their caches save.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Rust caches: only main saves them; PRs restore main's. A cache whose key already
# exists is never re-saved, so a failed run must not save a partial one.

jobs:
  build:
    name: Build

    strategy:
      fail-fast: false
      matrix:
        # macOS compiles the same code in Test (macos-latest, nightly).
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build
        run: cargo xtask build

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2

      - name: Build
        run: cargo xtask build

  test:
    name: Test

    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce and release builds wait for them; check nightly.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Check installer lock lifecycle
        run: python3 tools/switchboard/update_lock.test.py -v

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Test
        run: cargo xtask test

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - uses: mozilla-actions/sccache-action@v0.0.11

      # One cargo run builds the crates they share once, not once per crate.
      - name: Test zellij-utils, zellij-server and zellij-client
        run: cargo test --no-default-features -p zellij-utils -p zellij-server -p zellij-client --lib

      # Lives here rather than in Build (Windows): it needs the test profile,
      # which this job has already compiled, not Build's dev-opt profile.
      - name: Install NASM
        uses: ilammy/setup-nasm@v1.5.2

      # The same filter gates Windows releases in native-binaries.yml; running it
      # here catches Windows-only failures before they stall Windows updates.
      - name: Check Switchboard relay, installer and updater
        run: cargo test -p zellij-client --features web_server_capability switchboard_ --lib
      - name: Check Windows message hook launcher
        run: cargo test -p zellij-client --features web_server_capability message_board_hook_queues_with_a_windows_cmd_launcher --lib

  integration-test:
    name: Integration Test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run whole-app integration tests
        run: cargo xtask integration-test

  test-no-web:
    name: Test (No Web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Test without web support
        run: cargo xtask test --no-web

  # Assets and formatting only compile xtask (about 30s cold) and finish long
  # before the other jobs, so they don't spend the shared 10 GB cache budget.
  assets:
    name: Check Bundled Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Test xtask
        run: cargo test -p xtask

      - name: Check bundled assets
        run: cargo xtask assets --check

  format:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Check Format
        run: cargo xtask format --check
