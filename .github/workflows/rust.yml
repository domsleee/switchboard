name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Debug Clap parsing exceeds the default test-thread stack.
  RUST_MIN_STACK: 8388608

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# Rust caches: only main saves them; PRs restore main's. A cache whose key already
# exists is never re-saved, so a failed run must not save a partial one.

jobs:
  build:
    name: Build

    strategy:
      fail-fast: false
      matrix:
        # macOS compiles the same code in Test (macos-latest).
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Build
        run: cargo xtask build

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Build
        run: cargo xtask build

  test:
    name: Test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Test
        run: cargo xtask test

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Test zellij-utils
        run: cargo test --no-default-features -p zellij-utils --lib

      - name: Test zellij-server
        run: cargo test --no-default-features -p zellij-server --lib

      - name: Test zellij-client
        run: cargo test --no-default-features -p zellij-client --lib

      # Lives here rather than in Build (Windows): it needs the test profile,
      # which this job has already compiled, not Build's dev-opt profile.
      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Check Switchboard installer
        run: cargo test -p zellij-client --features web_server_capability switchboard_update::install --lib

  integration-test:
    name: Integration Test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run whole-app integration tests
        run: cargo xtask integration-test

  test-no-web:
    name: Test (No Web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Test without web support
        run: cargo xtask test --no-web

  # Assets and formatting only compile xtask (about 30s cold) and finish long
  # before the other jobs, so they don't spend the shared 10 GB cache budget.
  assets:
    name: Check Bundled Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false

      - name: Test xtask
        run: cargo test -p xtask

      - name: Check bundled assets
        run: cargo xtask assets --check

  format:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache: false

      - name: Check Format
        run: cargo xtask format --check
