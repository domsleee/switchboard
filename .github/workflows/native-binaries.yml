name: Native binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

# Finish the active release; newer pushes replace its pending successor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Thin LTO with parallel codegen; dependencies already come from rust-cache.
  # CARGO_PROFILE_RELEASE_LTO overrides `lto = true` (fat) in Cargo.toml.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  # rust-cache restores dependencies only; sccache also skips this workspace's own
  # crates when they did not change (zellij-utils and zellij-server, usually).
  # A cache service error compiles locally instead of failing the build.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          # A manual run on another branch must not evict main's caches.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Compile without sccache when its download fails
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"
      - uses: ilammy/setup-nasm@v1.5.2
      # libtest accepts multiple filters (OR). Keep the existing release checks
      # in one Cargo invocation so shared dependencies compile once.
      - name: Check Windows sessions, IPC, colours, resizing, relay and updates
        run: cargo test -p zellij-utils -p zellij-server -p zellij-client --no-default-features --features zellij-client/web_server_capability,zellij-server/web_server_capability --lib -- windows_session_catalog_tests windows_ipc windows_pane_environment windows_terminal_resize switchboard_
      - name: Check Windows update transactions and tray supervision
        run: |
          powershell -NoLogo -NoProfile -NonInteractive -File tools/switchboard/windows_releases.test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoLogo -NoProfile -NonInteractive -File tools/switchboard/windows_tray.test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoLogo -NoProfile -NonInteractive -File tools/switchboard/update_services_windows.test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  windows:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          # A manual run on another branch must not evict main's caches.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Compile without sccache when its download fails
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"
      - uses: ilammy/setup-nasm@v1.5.2
      - name: Build native server and relay
        run: cargo build --release --features web_server_capability
      - name: Verify packaged relay command
        run: .\target\release\zellij.exe serve --help
      - name: Package verified update bundle
        run: .\target\release\zellij.exe switchboard package --platform windows --commit $env:GITHUB_SHA --run-number $env:GITHUB_RUN_NUMBER --helpers tools/switchboard --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: switchboard-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both targets build on the ARM runner; the Intel binary is
          # cross-compiled (native clang, no emulation) and only executed
          # through Rosetta 2, which the runner image preinstalls.
          - runner: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          # Both macOS legs now share one runner image; keep their caches apart.
          # Refresh Intel's cache to retain the newly added host installer tests.
          cache-key: ${{ matrix.target }}${{ matrix.platform == 'macos-x86_64' && '-installer-v1' || '' }}
          # A manual run on another branch must not evict main's caches.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Compile without sccache when its download fails
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"
      # Both legs run on ARM hosts. Keep the host-only installer test on the
      # faster Intel cross-build leg; publishing still waits for both legs.
      - name: Check installer
        if: matrix.platform == 'macos-x86_64'
        run: cargo test -p zellij-client --features web_server_capability switchboard_update::install --lib
      - name: Build native server and relay
        run: cargo build --release --features web_server_capability --target ${{ matrix.target }}
      - name: Sign with Switchboard's certificate
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: .github/signing/sign.sh target/${{ matrix.target }}/release/zellij
      - name: Verify and package update bundle
        run: |
          target/${{ matrix.target }}/release/zellij serve --help
          target/${{ matrix.target }}/release/zellij switchboard package --platform ${{ matrix.platform }} --commit $GITHUB_SHA --run-number $GITHUB_RUN_NUMBER --helpers tools/switchboard --output dist
          # The packager copies its own executable, so prove the bundle
          # really contains the architecture its platform claims.
          file dist/zellij | grep -q '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: switchboard-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the binaries' glibc requirement low enough for older Ubuntu.
          - runner: ubuntu-22.04
            platform: linux-x86_64
            arch: x86-64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          # A manual run on another branch must not evict main's caches.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Compile without sccache when its download fails
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"
      - name: Build native server and relay
        run: cargo build --release --features web_server_capability
      - name: Verify and package update bundle
        run: |
          target/release/zellij serve --help
          target/release/zellij switchboard package --platform ${{ matrix.platform }} --commit $GITHUB_SHA --run-number $GITHUB_RUN_NUMBER --helpers tools/switchboard --output dist
          file dist/zellij | grep -q '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: switchboard-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Runs beside the Linux builds instead of before them; publish-linux waits for it.
  check-linux-updater:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-key: checks
          # A manual run on another branch must not evict main's caches.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Compile without sccache when its download fails
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"
      - name: Check installer and updater
        run: cargo test -p zellij-client --features web_server_capability switchboard_update --lib

  # Updaters download from one rolling prerelease. Its assets are replaced on
  # each build; the release is never recreated, so followers are not notified.
  # Publishing is split per platform: a failing Windows check must not strand
  # finished macOS or Linux bundles (and vice versa). Each platform has its own
  # concurrency group so two builds' uploads of its assets never interleave. One
  # shared group dropped Windows: GitHub keeps one pending job per group. Groups
  # do not order runs, so the script skips a build older than the published one.
  publish-windows:
    needs: [checks, windows]
    # Only this repository's main branch feeds automatic updates.
    if: github.ref == 'refs/heads/main' && github.repository == 'domsleee/switchboard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-main-release-windows
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: switchboard-windows
          path: artifacts/switchboard-windows
      - name: Replace rolling release assets
        run: |
          bash .github/scripts/publish_latest_main.test.sh
          bash .github/scripts/publish_latest_main.sh artifacts

  publish-macos:
    needs: [macos]
    # Only this repository's main branch feeds automatic updates.
    if: github.ref == 'refs/heads/main' && github.repository == 'domsleee/switchboard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-main-release-macos
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT_PATTERN: switchboard-macos-*
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.ARTIFACT_PATTERN }}
          path: artifacts
      - name: Replace rolling release assets
        run: |
          bash .github/scripts/publish_latest_main.test.sh
          bash .github/scripts/publish_latest_main.sh artifacts

  publish-linux:
    needs: [linux, check-linux-updater]
    # Only this repository's main branch feeds automatic updates.
    if: github.ref == 'refs/heads/main' && github.repository == 'domsleee/switchboard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-main-release-linux
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT_PATTERN: switchboard-linux-*
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.ARTIFACT_PATTERN }}
          path: artifacts
      - name: Replace rolling release assets
        run: |
          bash .github/scripts/publish_latest_main.test.sh
          bash .github/scripts/publish_latest_main.sh artifacts
