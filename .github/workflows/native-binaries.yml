name: Native binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Thin LTO with parallel codegen; dependencies already come from rust-cache.
  # CARGO_PROFILE_RELEASE_LTO overrides `lto = true` (fat) in Cargo.toml.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          # A manual run on another branch must not evict main's caches.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - uses: ilammy/setup-nasm@v1.5.2
      - name: Check Windows session discovery and colours
        run: |
          cargo test -p zellij-utils windows_session_catalog_tests --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p zellij-utils windows_ipc --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p zellij-server windows_pane_environment --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p zellij-server windows_terminal_resize --lib
      - name: Check Rust relay transport and update decisions
        run: cargo test -p zellij-client --features web_server_capability switchboard_ --lib
      - name: Check Windows update transactions and tray supervision
        run: |
          powershell -NoLogo -NoProfile -NonInteractive -File tools/switchboard/windows_releases.test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoLogo -NoProfile -NonInteractive -File tools/switchboard/windows_tray.test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoLogo -NoProfile -NonInteractive -File tools/switchboard/update_services_windows.test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  windows:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          # A manual run on another branch must not evict main's caches.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - uses: ilammy/setup-nasm@v1.5.2
      - name: Build native server and relay
        run: cargo build --release --features web_server_capability
      - name: Verify packaged relay command
        run: .\target\release\zellij.exe serve --help
      - name: Package verified update bundle
        run: .\target\release\zellij.exe switchboard package --platform windows --commit $env:GITHUB_SHA --run-number $env:GITHUB_RUN_NUMBER --helpers tools/switchboard --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: switchboard-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both targets build on the ARM runner; the Intel binary is
          # cross-compiled (native clang, no emulation) and only executed
          # through Rosetta 2, which the runner image preinstalls.
          - runner: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          # Both macOS legs now share one runner image; keep their caches apart.
          cache-key: ${{ matrix.target }}
          # A manual run on another branch must not evict main's caches.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      # The installer test only compiles for the host; running it again in
      # the cross leg would just repeat the ARM leg's work.
      - name: Check installer
        if: matrix.platform == 'macos-arm64'
        run: cargo test -p zellij-client --features web_server_capability switchboard_update::install --lib
      - name: Build native server and relay
        run: cargo build --release --features web_server_capability --target ${{ matrix.target }}
      - name: Sign with Switchboard's certificate
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: .github/signing/sign.sh target/${{ matrix.target }}/release/zellij
      - name: Verify and package update bundle
        run: |
          target/${{ matrix.target }}/release/zellij serve --help
          target/${{ matrix.target }}/release/zellij switchboard package --platform ${{ matrix.platform }} --commit $GITHUB_SHA --run-number $GITHUB_RUN_NUMBER --helpers tools/switchboard --output dist
          # The packager copies its own executable, so prove the bundle
          # really contains the architecture its platform claims.
          file dist/zellij | grep -q '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: switchboard-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the binaries' glibc requirement low enough for older Ubuntu.
          - runner: ubuntu-22.04
            platform: linux-x86_64
            arch: x86-64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          # A manual run on another branch must not evict main's caches.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - name: Check installer and updater
        if: matrix.platform == 'linux-x86_64'
        run: cargo test -p zellij-client --features web_server_capability switchboard_update --lib
      - name: Build native server and relay
        run: cargo build --release --features web_server_capability
      - name: Verify and package update bundle
        run: |
          target/release/zellij serve --help
          target/release/zellij switchboard package --platform ${{ matrix.platform }} --commit $GITHUB_SHA --run-number $GITHUB_RUN_NUMBER --helpers tools/switchboard --output dist
          file dist/zellij | grep -q '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: switchboard-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Updaters download from one rolling prerelease. Its assets are replaced on
  # each build; the release is never recreated, so followers are not notified.
  # Publishing is split per platform: a failing Windows check must not strand
  # finished macOS or Linux bundles (and vice versa). The jobs share one
  # concurrency group so their uploads to the same release never interleave.
  publish-windows:
    needs: [checks, windows]
    # Only this repository's main branch feeds automatic updates.
    if: github.ref == 'refs/heads/main' && github.repository == 'domsleee/switchboard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-main-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: switchboard-windows
          path: artifacts/switchboard-windows
      - name: Replace rolling release assets
        run: |
          set -euo pipefail
          gh release view latest-main >/dev/null 2>&1 ||
            gh release create latest-main --prerelease --latest=false --target "$GITHUB_SHA" \
              --title 'Latest main build' --notes 'Rolling build used by Switchboard automatic updates.'
          mkdir release
          for directory in artifacts/switchboard-*; do
            platform=${directory#artifacts/switchboard-}
            for file in "$directory"/*; do cp "$file" "release/switchboard-$platform-$(basename "$file")"; done
          done
          # Manifests last: updaters verify every asset against them and retry
          # on a mismatch while a newer upload is in progress.
          gh release upload latest-main --clobber $(ls release/* | grep -v -- '-bundle.json$')
          gh release upload latest-main --clobber release/*-bundle.json
          # The manifest's commit is authoritative; the tag follows for readers.
          git tag -f latest-main "$GITHUB_SHA"
          git push -f origin refs/tags/latest-main

  publish-macos:
    needs: [macos]
    # Only this repository's main branch feeds automatic updates.
    if: github.ref == 'refs/heads/main' && github.repository == 'domsleee/switchboard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-main-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT_PATTERN: switchboard-macos-*
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.ARTIFACT_PATTERN }}
          path: artifacts
      - name: Replace rolling release assets
        run: |
          set -euo pipefail
          gh release view latest-main >/dev/null 2>&1 ||
            gh release create latest-main --prerelease --latest=false --target "$GITHUB_SHA" \
              --title 'Latest main build' --notes 'Rolling build used by Switchboard automatic updates.'
          mkdir release
          for directory in artifacts/switchboard-*; do
            platform=${directory#artifacts/switchboard-}
            for file in "$directory"/*; do cp "$file" "release/switchboard-$platform-$(basename "$file")"; done
          done
          # Manifests last: updaters verify every asset against them and retry
          # on a mismatch while a newer upload is in progress.
          gh release upload latest-main --clobber $(ls release/* | grep -v -- '-bundle.json$')
          gh release upload latest-main --clobber release/*-bundle.json
          # The manifest's commit is authoritative; the tag follows for readers.
          git tag -f latest-main "$GITHUB_SHA"
          git push -f origin refs/tags/latest-main

  publish-linux:
    needs: [linux]
    # Only this repository's main branch feeds automatic updates.
    if: github.ref == 'refs/heads/main' && github.repository == 'domsleee/switchboard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-main-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT_PATTERN: switchboard-linux-*
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.ARTIFACT_PATTERN }}
          path: artifacts
      - name: Replace rolling release assets
        run: |
          set -euo pipefail
          gh release view latest-main >/dev/null 2>&1 ||
            gh release create latest-main --prerelease --latest=false --target "$GITHUB_SHA" \
              --title 'Latest main build' --notes 'Rolling build used by Switchboard automatic updates.'
          mkdir release
          for directory in artifacts/switchboard-*; do
            platform=${directory#artifacts/switchboard-}
            for file in "$directory"/*; do cp "$file" "release/switchboard-$platform-$(basename "$file")"; done
          done
          # Manifests last: updaters verify every asset against them and retry
          # on a mismatch while a newer upload is in progress.
          gh release upload latest-main --clobber $(ls release/* | grep -v -- '-bundle.json$')
          gh release upload latest-main --clobber release/*-bundle.json
          # The manifest's commit is authoritative; the tag follows for readers.
          git tag -f latest-main "$GITHUB_SHA"
          git push -f origin refs/tags/latest-main
