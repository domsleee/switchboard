name: End to End tests

on:
  # PR checks run on the PR merged into main, so merges are not rerun. Main
  # runs nightly to refresh the caches PRs restore; 16:00 UTC is 3 am in Sydney.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  # A new push to a PR replaces its run. Main runs finish so their caches save.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Rust relay and browser recovery
    # Slowest check, and macOS runners are scarce (release builds wait for them).
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          # Only main saves; PRs restore main's dev-opt build. An existing key
          # is never re-saved, so a run that failed before the build must not
          # save (the previous key was stuck without the build that way).
          cache-shared-key: e2e-dev-opt
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install headless Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/switchboard-browser" playwright
          "$RUNNER_TEMP/switchboard-browser/node_modules/.bin/playwright" install chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/switchboard-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Check sidebar behavior
        run: node acceptance/switchboard/run.cjs ui
      - name: Build browser-enabled native executable
        run: cargo build --profile dev-opt --locked
      - name: Check agent message delivery hooks
        env:
          SWITCHBOARD_TEST_BINARY: target/dev-opt/zellij
        run: node --test tools/switchboard/message_board.test.cjs tools/switchboard/agent-message-hooks.test.cjs
      - name: Check native sharing controls
        run: node acceptance/switchboard/run.cjs sharing target/dev-opt/zellij
      - name: Check browser reconnection and rollback
        # Replaces the executable with the same build and restarts connection
        # services. This checks handoff behavior, not mixed-version compatibility.
        env:
          SWITCHBOARD_TEST_IN_PLACE_RECONNECT: '1'
        run: node acceptance/switchboard/run.cjs browser target/dev-opt/zellij target/dev-opt/zellij
      - name: Check explicit activation with connected viewers
        # Distinct build identities exercise the real updater's version checks.
        # Both executables use this revision; this is not cross-release coverage.
        env:
          SWITCHBOARD_TEST_IN_PLACE_RECONNECT: '1'
          SWITCHBOARD_TEST_EXPLICIT_UPDATE: '1'
        run: |
          cp target/dev-opt/zellij "$RUNNER_TEMP/switchboard-update-candidate"
          SWITCHBOARD_COMMIT=0000000000000000000000000000000000000000 cargo build --profile dev-opt --locked
          node acceptance/switchboard/run.cjs browser target/dev-opt/zellij "$RUNNER_TEMP/switchboard-update-candidate"
      - name: Check automatic activation with retained viewers and rollback
        env:
          SWITCHBOARD_TEST_COMMIT: ${{ github.sha }}
        run: node tools/switchboard/attachment-update.test.cjs target/dev-opt/zellij "$RUNNER_TEMP/switchboard-update-candidate"
      - name: Check removal of temporary sharing recovery
        env:
          SWITCHBOARD_TEST_RECOVERY: '1'
        run: node tools/switchboard/attachment-update.test.cjs "$RUNNER_TEMP/switchboard-update-candidate" "$RUNNER_TEMP/switchboard-update-candidate"
      - name: Save private acceptance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-logs
          path: |
            /tmp/switchboard-browser-update-*/*.log
            /tmp/sbn-*/*.log
          if-no-files-found: ignore
          retention-days: 7

  resumable-viewer-proof:
    name: Resumable viewer proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The macOS and Windows legs are the slowest, and macOS runners are scarce
        # (release builds wait for them), so pull requests check Linux only.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long Git paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
          cache-shared-key: resumable-viewer-proof
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - uses: ilammy/setup-nasm@v1.5.2
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check Codex plugin hook configuration and Windows stdin
        run: node tools/switchboard/codex-plugin-hooks.test.cjs
      - name: Install isolated browser
        # --with-deps installs Linux libraries; on Windows it only enables Media
        # Foundation (about 3 minutes), which headless Chromium does not need.
        run: |
          npm install --prefix "$RUNNER_TEMP/resume-browser" playwright
          "$RUNNER_TEMP/resume-browser/node_modules/.bin/playwright" install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/resume-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Check input and replay bounds
        run: |
          cargo test --locked -p zellij-utils ipc_flush_failure --lib
          cargo test --locked -p zellij-server --features resumable_viewer_proof resumable_proof --lib
      - name: Build experimental engine
        run: cargo build --locked --profile dev-opt --features resumable_viewer_proof
      - name: Install isolated Codex for plugin hook proof
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-hook-proof" @openai/codex@0.167.0
          node - "$RUNNER_TEMP/codex-hook-proof/node_modules" <<'NODE' >> "$GITHUB_ENV"
          const fs=require('node:fs'),path=require('node:path'),root=process.argv[2];
          const binary=fs.readdirSync(root,{recursive:true}).find(name=>/[/\\]vendor[/\\].*[/\\]bin[/\\]codex(?:\.exe)?$/.test(name));
          if(!binary)throw Error('Installed Codex native binary not found');
          console.log('CODEX_TEST_BINARY='+path.join(root,binary));
          NODE
      - name: Prove Codex executes its plugin hooks through Switchboard
        env:
          SWITCHBOARD_TEST_BINARY: target/dev-opt/zellij${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node tools/switchboard/codex-plugin-hooks.test.cjs
      - name: Prove Codex user replies preserve drafts and survive relay restart
        run: node tools/switchboard/codex-user-queue.test.cjs target/dev-opt/zellij${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Prove bridge replacement and rollback with a real terminal
        env:
          # CI checks recovery and integrity with scheduling headroom. Local proof stays at 250 ms.
          RESUME_PROOF_LATENCY_MS: "1000"
        run: node tools/switchboard/resumable-viewer.test.cjs target/dev-opt/zellij${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Prove production attachment survives connection service replacement
        run: node tools/switchboard/attachment-update.test.cjs target/dev-opt/zellij${{ runner.os == 'Windows' && '.exe' || '' }} target/dev-opt/zellij${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Prove viewers and native clients survive an engine handoff
        run: node tools/switchboard/engine-handoff-viewer.test.cjs target/dev-opt/zellij${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Prove Windows updater and rollback preserve production attachments
        if: runner.os == 'Windows'
        env:
          SWITCHBOARD_TEST_AUTO_UPDATE: '1'
          SWITCHBOARD_TEST_CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          cp target/dev-opt/zellij.exe "$RUNNER_TEMP/attachment-update-candidate.exe"
          SWITCHBOARD_COMMIT=2222222222222222222222222222222222222222 cargo build --locked --profile dev-opt --features resumable_viewer_proof
          node tools/switchboard/update_windows_browser.test.cjs target/dev-opt/zellij.exe "$RUNNER_TEMP/attachment-update-candidate.exe"
      - name: Preserve proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resumable-viewer-proof-${{ matrix.os }}
          path: |
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/sbr-*/*.json
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/sbr-*/*.jsonl
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/sbr-*/*.txt
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/sbr-*/*.log
            ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}/sba-*/*.log
          if-no-files-found: ignore
          retention-days: 7
