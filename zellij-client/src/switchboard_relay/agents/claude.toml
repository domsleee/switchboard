# How Switchboard reads a Claude Code pane: working, ready, approval or input.
#
# When Claude Code changes its screen and a tab shows the wrong state:
# 1. Capture the pane: `zellij action dump-screen -p <pane id>` (the id is in
#    `zellij action list-clients`).
# 2. Add or change a pattern below. Patterns are regexes matched against the
#    lowercased screen, so write them in lowercase. Note the Claude version.
# 3. Add a test in attention.rs that classifies the captured screen.
#
# Lists match when any pattern matches. A list of lists matches when every
# pattern in one inner list matches.
version = "2026-11-09"

# Which panes are Claude: the running command, or its prompt footer on screen.
command = ['\bclaude(?:\.exe)?\b']
screen = [
  ['(?:bypass permissions|accept edits|auto mode|plan mode) on|shift\+tab to cycle'],
  ['accessing workspace:', 'yes, i trust this folder', 'enter to confirm'],
]

# Under the idle prompt box (❯). Without it the screen is a dialog or unknown.
footer = ['(?:bypass permissions|accept edits|auto mode|plan mode) on|shift\+tab to cycle', 'for shortcuts']

# In that footer: a count of running tasks, "· 1 shell ·" or "· 1 shell, 1 monitor".
# "← 1 agent" is always there and only names the key for switching agents (2.1.319).
background = ['·\s*[1-9]\d*\s+[a-z]']

# A turn ended by Esc, or by denying an approval, sends no hook. The marker counts only
# directly above the input box, or the finished line a denial prints between them; a
# later turn puts its prompt between them (2.1.319).
interrupted = ['⎿\s+interrupted\s+·\s+what should claude do instead\?\s*(?:[✻✽✶✳] \S+ for\s+(?:\d+\s*[hms]\s*)+(?:[•·]\s*(?:done\s+)?\d{1,2}:\d{2}\s*(?:am|pm)?)?\s*)?─{3,}']

# A finished turn, e.g. "✻ Baked for 4m 5s" or "✻ Sautéed for 26s".
completion = ['(?:worked for|[✻✽✶✳] \S+ for)\s+(?:\d+\s*[hms]\s*)+(?:[•·]\s*(?:done\s+)?\d{1,2}:\d{2}\s*(?:am|pm)?)?']

# Dialogs, checked in the last part of the screen when the prompt box is not idle.
approval = [[
  'esc(?:ape)? to cancel|enter to (?:submit|select|confirm)|press enter to confirm',
  '(?:^|\s)[12][.)]\s+(?:yes|no|allow|approve|deny)',
], [
  'enter to confirm',
  '(?m)^\s*❯?\s*no, exit\s*$',
  '(?m)^\s*❯?\s*yes, i trust this folder\s*$',
]]
input = [
  ['esc(?:ape)? to cancel|enter to (?:submit|select|confirm)|press enter to confirm', '[❯›]\s*\d+[.)]'],
  # MCP elicitation: Accept/Decline with only an "Esc to cancel" footer.
  ['esc to cancel', '(?m)^\s*mcp server ["“].+["”] requests your input\s*$', '(?m)^\s*❯?\s*(?:accept|decline)\b'],
]

[working]
# Spinner at the start of the terminal title: braille up to 2.1.227,
# half circles from 2.1.228.
title = ['^[\x{2801}-\x{28ff}\x{25d0}-\x{25d3}]']
# Above the prompt, newer than the last finished turn.
above_prompt = [
  # Before 2.1: "✻ Thinking… (12s · esc to interrupt)".
  '(?:^|\n|[•✻✽✶✳])[^\n]{0,70}\([^\n]{0,160}esc(?:ape)? to interrupt[^\n]{0,60}\)',
  # 2.1+: "· Perambulating… (23s · ↓ 1.4k tokens)", or "· Perambulating…" before
  # the timer starts. Its finished line has no "…". While a hook runs (2.1.319):
  # "✽ Fermenting… (running PreToolUse hook · 9m 34s · ↓ 38.2k tokens)".
  '(?:^|\n)[ \t]*[·✢✳✶✻✽*][ \t]+[^\n(]{1,60}…[ \t]*(?:\((?:running [^\n()·]{1,40} · )?\d+[hms]|\n)',
  '(?:^|\n)[ \t]*[·✢✳✶✻✽*][ \t]+waiting for [1-9]\d* background agents? to finish',
  # A Monitor keeps waiting after the reply ends: "1 monitor still running".
  '\b[1-9]\d* monitors? still running',
]
# Below the prompt: active background agents can outlive the main reply.
# Shell counts alone are not work: a dev server may stay running while Claude is idle.
below_prompt = [
  # A background agent row with a live timer: "◯ fork  Reading files   4m 19s · ↓ 461k tokens".
  '(?m)^[ \t]*◯[ \t]+\S[^\n]*\b\d+[hms]\b',
  # Monitors count in the task footer, "1 shell, 1 monitor", or "1 monitor still running".
  '\b[1-9]\d* monitors?\b',
]
