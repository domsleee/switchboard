[package]
name = "zellij-client"
version.workspace = true
authors = ["Kunal Mohan <kunalmohan99@gmail.com>"]
edition.workspace = true
description = "The client-side library for Zellij"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# TODO: we might want to move these to be workspace dependencies as well, but
# work is currently being done on moving all our async stuff to tokio from async_std,
# so let's see how that works out before rocking the boat
axum = { version = "0.8.4", features = ["ws"], optional = true }
axum-extra = { version = "0.12", features = ["cookie"], optional = true }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
sha2 = { workspace = true, optional = true }
time = { version = "0.3", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
hpke = { version = "0.13", default-features = false, features = ["std", "alloc", "x25519"], optional = true }
mesh-rand = { package = "rand", version = "0.9", optional = true }
ring = { version = "0.17", optional = true }
subtle = { version = "2.6", optional = true }
rcgen = { version = "0.14", optional = true }
tempfile = { workspace = true, optional = true }
rusqlite = { version = "0.30", default-features = false, features = ["bundled"], optional = true }

anyhow = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"], optional = true }
async-trait = { workspace = true }
crossterm = { workspace = true, features = ["events", "bracketed-paste"] }
dialoguer = { workspace = true, optional = true }
interprocess = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
include_dir = { workspace = true, optional = true }
zellij-utils = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
isahc = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.28", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
urlencoding = { version = "2.1", optional = true }

[target.'cfg(not(windows))'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(unix)'.dependencies]
daemonize = { workspace = true }
nix = { workspace = true, features = ["fs", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[dev-dependencies]
rcgen = "0.14"
serial_test = "3.0"
tempfile = "3"
# `test-util` enables `tokio::time::pause` / `advance`, used by the
# forward-timeout timer tests to drive virtual time deterministically.
tokio = { workspace = true, features = ["test-util"] }

[features]
web_server_capability = [
    "dep:isahc",
    "dep:tokio-tungstenite",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
    "dep:futures-util",
    "dep:urlencoding",
    "dep:dialoguer",
    "dep:base64",
    "dep:include_dir",
    "dep:tokio-util",
    "dep:axum",
    "dep:axum-extra",
    "dep:time",
    "dep:tower",
    "dep:axum-server",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:sha2",
    "dep:hpke",
    "dep:mesh-rand",
    "dep:ring",
    "dep:subtle",
    "dep:rcgen",
    "dep:tempfile",
    "dep:rusqlite",
    "zellij-utils/web_server_capability",
]
