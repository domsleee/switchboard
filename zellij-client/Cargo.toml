[package]
name = "zellij-client"
version.workspace = true
authors = ["Kunal Mohan <kunalmohan99@gmail.com>"]
edition.workspace = true
description = "The client-side library for Zellij"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# TODO: we might want to move these to be workspace dependencies as well, but
# work is currently being done on moving all our async stuff to tokio from async_std,
# so let's see how that works out before rocking the boat
futures = { version = "0.3.30", optional = true }
axum = { version = "0.8.4", features = ["ws"], optional = true }
axum-extra = { version = "0.12", features = ["cookie"], optional = true }
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
flate2 = { version = "1", optional = true }
sha2 = { workspace = true, optional = true }
time = { version = "0.3", optional = true }
tower-http = { version = "0.6.4", features = ["cors"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
hpke = { version = "0.13", default-features = false, features = ["std", "alloc", "x25519"], optional = true }
mesh-rand = { package = "rand", version = "0.9", optional = true }
ring = { version = "0.17", optional = true }
subtle = { version = "2.6", optional = true }
rcgen = { version = "0.14", optional = true }
fs2 = { version = "0.4", optional = true }
tempfile = { workspace = true, optional = true }
rusqlite = { version = "0.30", default-features = false, features = ["bundled"], optional = true }

anyhow = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
async-trait = { workspace = true }
crossterm = { workspace = true, features = ["events", "bracketed-paste"] }
dialoguer = { workspace = true }
interprocess = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
num_cpus = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
include_dir = { workspace = true }
zellij-utils = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
isahc = { workspace = true }
tokio-tungstenite = "0.28"
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
rustls-pki-types = "1"
futures-util = "0.3"
urlencoding = "2.1"

[target.'cfg(not(windows))'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(unix)'.dependencies]
daemonize = { workspace = true }
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
crossterm = { workspace = true }
tokio = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[dev-dependencies]
insta = "1.48"
rcgen = "0.14"
serde_json = "1.0"
serial_test = "3.0"
tempfile = "3"
# `test-util` enables `tokio::time::pause` / `advance`, used by the
# forward-timeout timer tests to drive virtual time deterministically.
tokio = { workspace = true, features = ["test-util"] }

[features]
unstable = []
web_server_capability = [
    "dep:futures",
    "dep:axum",
    "dep:axum-extra",
    "dep:time",
    "dep:axum-server",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:flate2",
    "dep:sha2",
    "dep:tower-http",
    "dep:tower",
    "dep:hpke",
    "dep:mesh-rand",
    "dep:ring",
    "dep:subtle",
    "dep:rcgen",
    "dep:fs2",
    "dep:tempfile",
    "dep:rusqlite",
    "zellij-utils/web_server_capability",
]
